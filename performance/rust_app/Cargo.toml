[package]
name = "rust_app"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
default-run = "rust_app"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1

[features]
default = []
multithreading = ["i_overlay/allow_multithreading"]

[dependencies]
i_overlay = { path = "../../iOverlay", version = "^9" }
